[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdaml"
version = "0.1.0"
description = "Persistent H0/H1 and fixed-schema topological machine learning features"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
researchos = "researchos.__main__:main"
tdaml = "tdaml.__main__:main"

[tool.setuptools.packages.find]
include = ["tdaml*", "researchos*"]

[tool.setuptools.package-data]
researchos = ["*.json"]
