[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"
[project]
name="tda-ml"
version="0.1.0"
requires-python=">=3.10"
description="Bounded TDA and machine learning with replayable research evidence"
readme="README.md"
license={text="Apache-2.0"}
[project.scripts]
tda-ml="tda_ml.__main__:main"
researchos="researchos.__main__:main"
[tool.setuptools.packages.find]
include=["tda_ml*","researchos*"]
[tool.setuptools.package-data]
researchos=["*.json"]
